name: USM-Kleinanzeigen-Wächter

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Probealarm senden"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: waechter

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Kleinanzeigen prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WAECHTER_TEST: ${{ inputs.test && '1' || '0' }}
        run: python3 waechter.py
      - name: Stand speichern (nur bei Änderung)
        run: |
          git config user.name "usm-kleinanzeigen-waechter"
          git config user.email "usm-kleinanzeigen-waechter@users.noreply.github.com"
          git add gesehen.json treffer.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Stand aktualisiert" && git push)
